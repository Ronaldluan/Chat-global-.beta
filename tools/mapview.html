<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Vale Quieto — visualizador do mapa</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 12px/1.4 monospace; }
  #bar { padding: 6px 10px; background: #1b1d1c; position: sticky; top: 0; z-index: 2; }
  #bar input { width: 90px; background: #222; color: #eee; border: 1px solid #444; }
  #bar label { margin-left: 10px; }
  canvas { display: block; margin: 8px; image-rendering: pixelated; }
  #legend span { display: inline-block; margin-right: 10px; }
  #legend i { display: inline-block; width: 10px; height: 10px; margin-right: 3px; vertical-align: -1px; }
</style>
</head>
<body>
<div id="bar">
  seed <input id="seed"> <button id="go">gerar</button>
  <label><input type="checkbox" id="roofs"> telhados</label>
  <label><input type="checkbox" id="rooms"> cômodos</label>
  <label><input type="checkbox" id="labels" checked> nomes</label>
  <label><input type="checkbox" id="zs" checked> zumbis</label>
  <span id="info"></span>
  <div id="legend"></div>
</div>
<canvas id="cv"></canvas>
<script src="../js/core.js"></script>
<script src="../js/items.js"></script>
<script src="../js/world.js"></script>
<script>
(function () {
  const G = window.G, F = G.FLOOR, W = G.WALL, WS = G.WS;
  const P = G.params;
  const S = +(P.scale || 6);
  const $ = (id) => document.getElementById(id);
  $('seed').value = P.seed != null ? P.seed : 1337;
  $('roofs').checked = P.roofs === '1';
  $('rooms').checked = P.rooms === '1';
  if (P.labels === '0') $('labels').checked = false;
  if (P.zs === '0') $('zs').checked = false;

  const FLOOR_COL = {
    [F.NONE]: '#000', [F.GRASS]: '#5b7a3a', [F.DIRT]: '#7a6040', [F.ASPHALT]: '#3b3d40', [F.SIDEWALK]: '#9a9890',
    [F.WOOD]: '#a07a4c', [F.TILE]: '#c8cfd0', [F.CARPET]: '#8a5a5a', [F.CONCRETE]: '#80807a', [F.WATER]: '#2d5d86',
    [F.ROAD_LINE]: '#d8b83a', [F.GRAVEL]: '#8c877a', [F.DARK_GRASS]: '#3c5a2a', [F.SAND]: '#cdbb88', [F.LINOLEUM]: '#b9b09a',
  };
  const WALL_COL = {
    [W.WOOD]: '#e8dcc0', [W.BRICK]: '#b0553d', [W.PLASTER]: '#f2efe6', [W.FENCE_WOOD]: '#6b4a2a', [W.FENCE_METAL]: '#9aa3a8',
    [W.HEDGE]: '#234a1c', [W.CONCRETE]: '#c0c0bb', [W.GLASS]: '#9fd4ec', [W.WINDOW]: '#7cc4ea', [W.DOOR]: '#6a3a1a', [W.GARAGE_DOOR]: '#707880',
  };
  const OBJ_COL = {
    tree: '#1f4a18', pine: '#173c22', bush: '#2f6a26', rock: '#77756e', car: '#c43c3c', police_car: '#1b2a6a', ambulance: '#f0f0f0',
    lamp_post: '#ffe070', mailbox: '#3060c0', trash_can: '#4a5a4a', dumpster: '#2a5a3a', bench: '#8a6a44', fuel_pump: '#e0b020',
    grave: '#b8b8b0', rug: 'rgba(160,60,60,0.45)', fence_gate: '#c09050', tire: '#222', barrel: '#6a4a30', log_pile: '#7a5020',
    picnic_table: '#9a7040', swing: '#aa5555', pallet: '#b09060', crate: '#a07840',
  };
  const FURN = '#2a2320';
  // mobília: cor + letra (desenhada quando a escala >= 12)
  const FURN_STYLE = {
    bed: ['#5a6ea8', 'B'], double_bed: ['#5a6ea8', 'B'], sofa: ['#8a4a6a', 'S'], armchair: ['#8a4a6a', 'a'], tv: ['#111', 'T'],
    table: ['#b08850', 't'], chair: ['#c8a070', 'c'], desk: ['#704a28', 'D'], bookshelf: ['#5a3a20', 'E'], wardrobe: ['#4a2e18', 'W'],
    dresser: ['#6a4a2a', 'd'], fridge: ['#e8e8e8', 'F'], stove: ['#555', 'O'], sink: ['#9ab', 's'], kitchen_counter: ['#c9c2b0', 'k'],
    counter: ['#a89070', 'k'], toilet: ['#f4f8ff', 'v'], bathtub: ['#dfefff', 'b'], shower: ['#bfe0ff', 'h'], medicine_cabinet: ['#fff', '+'],
    shelf: ['#8a7a60', '#'], cash_register: ['#3a3', '$'], freezer: ['#cde', 'Z'], locker: ['#6a7a8a', 'L'], gun_locker: ['#334', 'G'],
    workbench: ['#7a5a3a', 'w'], washing_machine: ['#eee', 'm'], lamp: ['#fe8', 'l'], plant: ['#3a8a3a', 'p'], vending_machine: ['#38c', 'V'],
  };

  const cv = $('cv'), ctx = cv.getContext('2d');
  function draw() {
    const seed = (+$('seed').value | 0) >>> 0;
    const t0 = performance.now();
    const m = G.world.generate(seed);
    const dt = performance.now() - t0;
    cv.width = m.w * S; cv.height = m.h * S;
    for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
      const i = y * m.w + x;
      ctx.fillStyle = FLOOR_COL[m.floor[i]] || '#f0f';
      ctx.fillRect(x * S, y * S, S, S);
    }
    if ($('rooms').checked) {
      for (const r of m.rooms) {
        ctx.fillStyle = 'hsla(' + ((r.id * 67) % 360) + ',70%,55%,0.35)';
        for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) if (m.room[y * m.w + x] === r.id) ctx.fillRect(x * S, y * S, S, S);
      }
    }
    // objetos
    for (const o of m.objects) {
      const fs = FURN_STYLE[o.type];
      const col = OBJ_COL[o.type] || (fs ? fs[0] : FURN);
      ctx.fillStyle = col;
      const pad = o.type === 'tree' || o.type === 'pine' || o.type === 'bush' ? S * 0.12 : S * 0.08;
      ctx.fillRect(o.x * S + pad, o.y * S + pad, o.w * S - pad * 2, o.h * S - pad * 2);
      if (o.type === 'car' || o.type === 'police_car' || o.type === 'ambulance') { // capô
        const cx = (o.x + o.w / 2) * S, cy = (o.y + o.h / 2) * S, d = [[1, 0], [0, 1], [-1, 0], [0, -1]][o.rot];
        ctx.fillStyle = '#ffd'; ctx.fillRect(cx + d[0] * (o.w * S / 2 - S * 0.35) - 1, cy + d[1] * (o.h * S / 2 - S * 0.35) - 1, 3, 3);
      }
      if (fs && S >= 12) {
        ctx.fillStyle = '#000'; ctx.font = 'bold ' + Math.floor(S * 0.7) + 'px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(fs[1], (o.x + o.w / 2) * S, (o.y + o.h / 2) * S + 1);
        if (o.type !== 'rug') { // marca a frente do objeto
          const d = [[1, 0], [0, 1], [-1, 0], [0, -1]][o.rot];
          ctx.fillStyle = 'rgba(255,255,255,0.8)';
          ctx.fillRect((o.x + o.w / 2 + d[0] * (o.w / 2 - 0.12)) * S - 1.5, (o.y + o.h / 2 + d[1] * (o.h / 2 - 0.12)) * S - 1.5, 3, 3);
        }
      }
      if (o.container) { ctx.strokeStyle = o.container.items.length ? '#ffd23a' : '#b09a50'; ctx.lineWidth = 1; ctx.strokeRect(o.x * S + 0.5, o.y * S + 0.5, o.w * S - 1, o.h * S - 1); }
      if (o.light) { ctx.fillStyle = 'rgba(255,230,140,0.12)'; ctx.beginPath(); ctx.arc((o.x + 0.5) * S, (o.y + 0.5) * S, o.light.radius * S * 0.5, 0, 7); ctx.fill(); }
    }
    // paredes
    for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
      const i = y * m.w + x, wv = m.wall[i];
      if (!wv) continue;
      const st = m.wallState[i];
      ctx.fillStyle = WALL_COL[wv] || '#f0f';
      if (wv === W.WINDOW || wv === W.GLASS) {
        ctx.fillStyle = '#e8e4d8'; ctx.fillRect(x * S, y * S, S, S);
        ctx.fillStyle = st & WS.BROKEN ? '#e04040' : st & WS.CURTAIN ? '#5a86a8' : WALL_COL[wv];
        ctx.fillRect(x * S + 1, y * S + 1, S - 2, S - 2);
      } else if (wv === W.DOOR || wv === W.GARAGE_DOOR) {
        ctx.fillStyle = st & WS.OPEN ? '#e0a060' : st & WS.LOCKED ? '#ff2a2a' : WALL_COL[wv];
        ctx.fillRect(x * S, y * S, S, S);
      } else if (wv === W.FENCE_WOOD || wv === W.FENCE_METAL) {
        ctx.fillRect(x * S + S * 0.3, y * S + S * 0.3, S * 0.4, S * 0.4);
        ctx.fillRect(x * S + S * 0.42, y * S, S * 0.16, S); ctx.fillRect(x * S, y * S + S * 0.42, S, S * 0.16);
      } else ctx.fillRect(x * S, y * S, S, S);
    }
    if ($('roofs').checked) for (const b of m.buildings) {
      ctx.fillStyle = b.roofColor; ctx.globalAlpha = 0.85;
      for (let y = b.y; y < b.y + b.h; y++) for (let x = b.x; x < b.x + b.w; x++) if (m.building[y * m.w + x] === b.id) ctx.fillRect(x * S, y * S, S, S);
      ctx.globalAlpha = 1;
    }
    if ($('zs').checked) for (const z of m.zombieSpawns) {
      ctx.strokeStyle = 'rgba(255,40,40,0.8)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(z.x * S, z.y * S, 1.5 + z.weight * 2.2, 0, 7); ctx.stroke();
    }
    // ponto inicial
    const sp = m.spawnPoint;
    ctx.fillStyle = '#00ffd0'; ctx.strokeStyle = '#000';
    ctx.beginPath(); ctx.arc(sp.x * S, sp.y * S, S * 1.1, 0, 7); ctx.fill(); ctx.stroke();
    if ($('labels').checked) {
      ctx.font = 'bold ' + Math.max(9, S * 1.6) + 'px monospace'; ctx.textAlign = 'center';
      for (const b of m.buildings) {
        if (b.type === 'house' && S < 6) continue;
        const txt = b.name.replace('Casa dos ', '');
        const x = (b.x + b.w / 2) * S, y = (b.y + b.h / 2) * S;
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.strokeText(txt, x, y);
        ctx.fillStyle = b.type === 'house' ? '#fff' : '#ffe07a'; ctx.fillText(txt, x, y);
      }
    }
    const cont = m.objects.filter((o) => o.container).length;
    $('info').textContent = `  seed ${seed} · ${dt.toFixed(0)} ms · ${m.buildings.length} prédios · ${m.rooms.length} cômodos · ${m.objects.length} objetos (${cont} contêineres) · ${m.zombieSpawns.length} pontos de zumbi`;
    window.MAP = m;
  }
  const L = [['porta', WALL_COL[W.DOOR]], ['trancada', '#ff2a2a'], ['aberta', '#e0a060'], ['janela', WALL_COL[W.WINDOW]], ['cortina', '#5a86a8'],
    ['quebrada', '#e04040'], ['contêiner', '#ffd23a'], ['início', '#00ffd0'], ['zumbis', '#ff2828']];
  $('legend').innerHTML = L.map(([n, c]) => `<span><i style="background:${c}"></i>${n}</span>`).join('');
  $('go').onclick = draw;
  for (const id of ['roofs', 'rooms', 'labels', 'zs']) $(id).onchange = draw;
  draw();
})();
</script>
</body>
</html>
